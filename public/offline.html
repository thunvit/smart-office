<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e6f68">
<title>SmartOffice – Mất kết nối</title>
<style>
  :root{--bg:#f6f7f6;--fg:#1d2422;--muted:#5d6865;--accent:#0e6f68}
  @media (prefers-color-scheme: dark){:root{--bg:#121716;--fg:#e6ecea;--muted:#9aa7a3;--accent:#4cb5aa}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:16px;box-sizing:border-box}
  .box{max-width:420px;text-align:center}
  .mark{width:56px;height:56px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;margin:0 auto 16px}
  h1{font-size:20px;margin:0 0 8px}
  p{color:var(--muted);line-height:1.55;margin:0 0 20px}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <div class="mark">SO</div>
  <h1>Thiết bị đang mất kết nối mạng</h1>
  <p>SmartOffice cần kết nối Internet để tải dữ liệu công việc. Vui lòng kiểm tra Wi‑Fi hoặc dữ liệu di động, sau đó thử lại.</p>
  <button onclick="location.reload()">Thử lại</button>
</div>
</body>
</html>

name: Kiểm tra mã nguồn
on:
  push:
    branches: [main]
  pull_request:
jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kiểm tra cú pháp
        run: for f in *.js public/*.js worker/*.js test/*.js; do node --check "$f"; done
      - name: Khởi động thử và gọi kiểm tra sức khỏe
        run: |
          DATA_DIR=$RUNNER_TEMP/so PORT=3000 node server.js > server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://localhost:3000/healthz && break; sleep 1; done
          curl -fsS http://localhost:3000/manifest.webmanifest > /dev/null
          curl -fsS -X POST http://localhost:3000/api/login -H 'content-type: application/json' -d '{"username":"admin","password":"Admin@123"}' | grep -q '"user"'
          echo "Đạt."
      - name: Kiểm thử lõi Cloudflare (mô phỏng Durable Object)
        run: |
          set -o pipefail
          node test/worker-smoke.js | tee out.txt
          grep -q "KẾT QUẢ: đạt" out.txt
          grep -q "lockout persist 429" out.txt
          grep -q "backup-manifest 200" out.txt
          grep -q "download 200 true" out.txt
          grep -q "re-instantiate 200" out.txt
          grep -q "work-template 200 3" out.txt
          grep -q "work-post 200" out.txt
          grep -q "ai 403 200 200" out.txt
      - name: Kiểm thử phân hệ Công việc – Dự án (phân quyền, luồng trạng thái)
        run: |
          node test/work-test.js | tee work.txt
          grep -q "0 không đạt" work.txt
      - name: Kiểm thử hàm lập kế hoạch (lặp lại, phụ thuộc)
        run: |
          node test/work-plan-test.js | tee plan.txt
          grep -q "0 không đạt" plan.txt
      - name: Kiểm thử chức năng đầy đủ theo Base Wework (trường tùy chỉnh, mẫu, nhập/xuất, báo cáo, tác vụ hàng loạt)
        run: |
          node test/work-ext-test.js | tee ext.txt
          grep -q "0 không đạt" ext.txt
      - name: Kiểm thử xác thực (đăng nhập, khóa khi sai nhiều lần, đổi mật khẩu, thu hồi phiên, ép đổi mật khẩu, phân quyền, nhật ký an ninh)
        run: |
          set -o pipefail
          node test/auth-test.js | tee auth.txt
          grep -q "0 không đạt" auth.txt
      - name: Kiểm thử sao lưu, khôi phục (xuất rồi khôi phục vào Durable Object mới phải trùng khớp; PITR với ctx giả lập)
        run: |
          set -o pipefail
          node test/backup-test.js | tee backup.txt
          grep -q "0 không đạt" backup.txt
      - name: Kiểm thử trợ lý AI (nhà cung cấp giả lập; phân quyền, xác nhận thao tác ghi, che dữ liệu cá nhân, hạn mức; ADR-010)
        run: |
          set -o pipefail
          node test/ai-test.js | tee ai.txt
          grep -q "0 không đạt" ai.txt
